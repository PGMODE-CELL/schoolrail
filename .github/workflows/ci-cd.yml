# GitHub Actions CI/CD Configuration for SchoolRail

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
          
      - name: Run linter
        run: |
          pip install ruff
          ruff check app/
          
      - name: Run tests
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=xml -v

  # Frontend Tests
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        working-directory: admin
        run: npm ci
          
      - name: Run linter
        working-directory: admin
        run: npm run lint
          
      - name: Run tests
        working-directory: admin
        run: npm run test -- --coverage

  # Build Check
  build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Build backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "from main import app; print('Backend builds successfully')"
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build admin
        working-directory: admin
        run: |
          npm ci
          npm run build

  # Docker Build (optional)
  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          docker build -t schoolrail/backend:latest ./backend
          docker build -t schoolrail/admin:latest ./admin
          
      - name: Run container
        run: |
          docker-compose up -d
          sleep 10
          curl -f http://localhost:3001/api/v1/health || exit 1
          docker-compose down