x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  logging: *default-logging
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    REDIS_URL: redis://redis:6379/0
    RABBITMQ_URL: amqp://schoolrail:password@rabbitmq:5672/
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_SERVICE_NAME: schoolrail
    PYTHONPATH: /app

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: schoolrail
      POSTGRES_PASSWORD: password
      POSTGRES_DB: schoolrail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolrail -d schoolrail"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  pgbouncer:
    image: bitnami/pgbouncer:1.22
    ports:
      - "6432:6432"
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: schoolrail
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: schoolrail
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_MIN_POOL_SIZE: "5"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgbouncer -u pgbouncer -q -v || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: schoolrail
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: schoolrail
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  gateway:
    <<: *backend-base
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: gateway
      SERVICE_PORT: "8000"
      OTEL_SERVICE_NAME: schoolrail-gateway
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  auth-service:
    <<: *backend-base
    environment:
      SERVICE_NAME: auth
      SERVICE_PORT: "8001"
      DATABASE_URL: postgresql+asyncpg://schoolrail:password@postgres:5432/schoolrail_auth
      OTEL_SERVICE_NAME: schoolrail-auth
    ports:
      - "8001:8001"

  fleet-service:
    <<: *backend-base
    environment:
      SERVICE_NAME: fleet
      SERVICE_PORT: "8002"
      DATABASE_URL: postgresql+asyncpg://schoolrail:password@pgbouncer:6432/tenant_default
      OTEL_SERVICE_NAME: schoolrail-fleet
    ports:
      - "8002:8002"

  routing-service:
    <<: *backend-base
    environment:
      SERVICE_NAME: routing
      SERVICE_PORT: "8003"
      DATABASE_URL: postgresql+asyncpg://schoolrail:password@pgbouncer:6432/tenant_default
      OTEL_SERVICE_NAME: schoolrail-routing
    ports:
      - "8003:8003"

  student-service:
    <<: *backend-base
    environment:
      SERVICE_NAME: students
      SERVICE_PORT: "8004"
      DATABASE_URL: postgresql+asyncpg://schoolrail:password@pgbouncer:6432/tenant_default
      OTEL_SERVICE_NAME: schoolrail-students
    ports:
      - "8004:8004"

  geo-service:
    <<: *backend-base
    environment:
      SERVICE_NAME: geo
      SERVICE_PORT: "8005"
      DATABASE_URL: postgresql+asyncpg://schoolrail:password@pgbouncer:6432/tenant_default
      OTEL_SERVICE_NAME: schoolrail-geo
    ports:
      - "8005:8005"

  tenant-service:
    <<: *backend-base
    environment:
      SERVICE_NAME: tenant
      SERVICE_PORT: "8006"
      DATABASE_URL: postgresql+asyncpg://schoolrail:password@postgres:5432/schoolrail_tenants
      SHARED_DB_URL: postgresql://schoolrail:password@postgres:5432/schoolrail
      OTEL_SERVICE_NAME: schoolrail-tenant
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    <<: *backend-base
    environment:
      SERVICE_NAME: payments
      SERVICE_PORT: "8007"
      OTEL_SERVICE_NAME: schoolrail-payments
    ports:
      - "8007:8007"

  notification-service:
    <<: *backend-base
    environment:
      SERVICE_NAME: notifications
      SERVICE_PORT: "8008"
      OTEL_SERVICE_NAME: schoolrail-notifications
    ports:
      - "8008:8008"

  celery-worker:
    <<: *backend-base
    environment:
      SERVICE_NAME: worker
      WORKER_QUEUES: optimization,reports,notifications,sync
      DATABASE_URL: postgresql+asyncpg://schoolrail:password@postgres:5432/schoolrail
      RABBITMQ_URL: amqp://schoolrail:password@rabbitmq:5672/
      OTEL_SERVICE_NAME: schoolrail-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8005/ws
    depends_on:
      - gateway
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/k8s/configmaps/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    logging: *default-logging
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    logging: *default-logging
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.0
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infrastructure/k8s/configmaps/otel-collector.yaml:/etc/otel-collector-config.yaml
    command:
      - --config=/etc/otel-collector-config.yaml
    depends_on:
      - jaeger
    logging: *default-logging
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
