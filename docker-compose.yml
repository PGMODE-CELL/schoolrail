version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &db-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

services:
  api-gateway:
    image: kong:3.7
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_PROXY_LISTEN: "0.0.0.0:8000 http2, 0.0.0.0:8443 http2 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_LOG_LEVEL: debug
      KONG_PLUGINS: bundled,openid-connect,rate-limiting,request-transformer
      KONG_NGINX_WORKER_PROCESSES: "2"
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./docker/kong/plugins:/usr/local/share/lua/5.1/kong/plugins
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      APP_NAME: SchoolRail API
      DEBUG: "false"
      DATABASE_URL: postgresql://schoolrail:password@postgres-shared:5432/schoolrail
      REDIS_URL: redis://redis-cluster:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      OTEL_SERVICE_NAME: schoolrail-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
    depends_on:
      postgres-shared:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: unless-stopped
    logging: *default-logging

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3002:8000"
    environment:
      APP_NAME: SchoolRail Auth Service
      DEBUG: "false"
      DATABASE_URL: postgresql://schoolrail:password@postgres-shared:5432/schoolrail_auth
      REDIS_URL: redis://redis-cluster:6379/1
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OTEL_SERVICE_NAME: schoolrail-auth
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres-shared:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  tenant-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3003:8000"
    environment:
      APP_NAME: SchoolRail Tenant Service
      DEBUG: "false"
      DATABASE_URL: postgresql://schoolrail:password@pgbouncer:6432/schoolrail_tenants
      REDIS_URL: redis://redis-cluster:6379/2
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OTEL_SERVICE_NAME: schoolrail-tenant
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks worker -l info -c 4
    environment:
      DATABASE_URL: postgresql://schoolrail:password@postgres-shared:5432/schoolrail
      REDIS_URL: redis://redis-cluster:6379/0
      RABBITMQ_URL: amqp://schoolrail:password@rabbitmq:5672/
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OTEL_SERVICE_NAME: schoolrail-celery
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      postgres-shared:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DATABASE_URL: postgresql://schoolrail:password@postgres-shared:5432/schoolrail
      REDIS_URL: redis://redis-cluster:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      postgres-shared:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  postgres-shared:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: schoolrail
      POSTGRES_PASSWORD: password
      POSTGRES_DB: schoolrail
      POSTGRES_MULTIPLE_DATABASES: schoolrail_auth,schoolrail_tenants,schoolrail_analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolrail"]
      <<: *db-healthcheck
    restart: unless-stopped
    logging: *default-logging

  pgbouncer:
    image: bitnami/pgbouncer:1.22
    ports:
      - "6432:6432"
    environment:
      POSTGRESQL_HOST: postgres-shared
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_USERNAME: schoolrail
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: schoolrail
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_MIN_POOL_SIZE: "5"
      PGBOUNCER_RESERVE_POOL_SIZE: "5"
      PGBOUNCER_SERVER_IDLE_TIMEOUT: "600"
      PGBOUNCER_QUERY_TIMEOUT: "30"
    depends_on:
      postgres-shared:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgbouncer -u pgbouncer -q -v"]
      <<: *db-healthcheck
    restart: unless-stopped
    logging: *default-logging

  redis-cluster:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: schoolrail
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_ENABLED_PLUGINS: rabbitmq_management,rabbitmq_prometheus,rabbitmq_shovel,rabbitmq_federation
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: schoolrail
      MINIO_ROOT_PASSWORD: password123
      MINIO_REGION: us-east-1
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/k8s/configmaps/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    depends_on:
      - otel-collector
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3005:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/k8s/configmaps/grafana-dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090
    restart: unless-stopped
    logging: *default-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.0
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    volumes:
      - ./infrastructure/k8s/configmaps/otel-collector.yaml:/etc/otel-collector-config.yaml
    command:
      - --config=/etc/otel-collector-config.yaml
    depends_on:
      - jaeger
      - prometheus
    restart: unless-stopped
    logging: *default-logging

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:
