apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: schoolrail-monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /etc/ssl/certs/tls.crt
              key_file: /etc/ssl/certs/tls.key
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - https://your-domain.com
                - https://admin.your-domain.com
              allowed_headers:
                - content-type
                - authorization
      hostmetrics:
        collection_interval: 10s
        scrapers:
          cpu: null
          disk: null
          load: null
          filesystem: null
          memory: null
          network: null
          paging: null
      kubeletstats:
        collection_interval: 10s
        auth_type: serviceAccount
        endpoint: https://${env:K8S_NODE_NAME}:10250
        insecure_skip_verify: true
      prometheus:
        config:
          scrape_configs:
            - job_name: otel-collector
              scrape_interval: 10s
              static_configs:
                - targets:
                    - ${env:MY_POD_IP}:8888
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
        send_batch_max_size: 2048
      memory_limiter:
        check_interval: 1s
        limit_mib: 1024
        spike_limit_mib: 256
      attributes:
        actions:
          - key: environment
            value: production
            action: upsert
          - key: cluster
            value: schoolrail-production
            action: upsert
          - key: service.namespace
            value: schoolrail
            action: upsert
      resourcedetection:
        detectors:
          - eks
          - ec2
          - env
        timeout: 5s
      filter:
        error_mode: ignore
        metrics:
          exclude:
            match_type: regexp
            metric_names:
              - ^container.cpu.usage.*
              - ^container.memory.usage.*
    exporters:
      otlp:
        endpoint: jaeger-collector.schoolrail-monitoring.svc.cluster.local:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: schoolrail
        const_labels:
          environment: production
          cluster: schoolrail
        resource_to_telemetry_conversion:
          enabled: true
      loki:
        endpoint: http://loki-gateway.schoolrail-monitoring.svc.cluster.local:3100/loki/api/v1/push
        tls:
          insecure: true
        format: json
        labels:
          resource:
            service.name: true
            service.namespace: true
            k8s.pod.name: true
            k8s.namespace.name: true
            k8s.container.name: true
          record:
            severity: true
      logging:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      zpages:
        endpoint: 0.0.0.0:55679
    service:
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
            - attributes
            - resourcedetection
          exporters:
            - otlp
            - logging
        metrics:
          receivers:
            - otlp
            - hostmetrics
            - kubeletstats
            - prometheus
          processors:
            - memory_limiter
            - filter
            - batch
            - attributes
            - resourcedetection
          exporters:
            - prometheus
            - logging
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
            - attributes
            - resourcedetection
          exporters:
            - loki
            - logging
      extensions:
        - health_check
        - pprof
        - zpages
