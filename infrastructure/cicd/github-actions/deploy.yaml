name: Deploy to SchoolRail

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      service:
        description: Service to deploy (all if empty)
        required: false
        type: string
      skip_migrations:
        description: Skip database migrations
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
  ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Type check backend
        working-directory: backend
        run: mypy . --ignore-missing-imports
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint admin
        working-directory: admin
        run: |
          npm ci
          npm run lint
      - name: Type check admin
        working-directory: admin
        run: npx tsc --noEmit

  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schoolrail
          POSTGRES_PASSWORD: password
          POSTGRES_DB: schoolrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://schoolrail:password@localhost:5432/schoolrail_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-testing-only
        run: python -m pytest tests/ -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend

  build:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        service:
          - backend
          - admin
          - parent-app
          - driver-app
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/schoolrail/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Run Database Migrations
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name schoolrail-${{ github.ref_name == 'main' && 'production' || 'staging' }} --region $AWS_REGION
      - name: Run migrations
        if: ${{ !inputs.skip_migrations || inputs.skip_migrations == false }}
        run: |
          kubectl create job --from=cronjob/schoolrail-db-migration migration-manual-$(date +%s) -n schoolrail-${{ github.ref_name == 'main' && 'production' || 'staging' }}
          kubectl wait --for=condition=complete --timeout=300s job/migration-manual-* -n schoolrail-${{ github.ref_name == 'main' && 'production' || 'staging' }} || \
            (echo "Migration failed, rolling back..." && exit 1)

  deploy:
    name: Deploy via ArgoCD
    needs: migrate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64
      - name: Login to ArgoCD
        run: |
          argocd login $ARGOCD_SERVER --grpc-web --auth-token $ARGOCD_AUTH_TOKEN --insecure
      - name: Sync ArgoCD Applications
        id: argocd-sync
        continue-on-error: true
        run: |
          APPS=$(argocd app list -o name | grep schoolrail-${{ github.ref_name == 'main' && 'production' || 'staging' }})
          for app in $APPS; do
            argocd app sync $app --prune --timeout 300 --grpc-web
          done
      - name: Wait for sync status
        if: steps.argocd-sync.outcome == 'success'
        run: |
          APPS=$(argocd app list -o name | grep schoolrail-${{ github.ref_name == 'main' && 'production' || 'staging' }})
          for app in $APPS; do
            argocd app wait $app --health --timeout 300 --grpc-web
          done

  smoke-test:
    name: Run Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install httpx pytest
      - name: Run smoke tests
        id: smoke-tests
        continue-on-error: true
        env:
          API_BASE_URL: ${{ github.ref_name == 'main' && 'https://api.your-domain.com' || 'https://api.staging.your-domain.com' }}
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
        run: |
          python -m pytest backend/tests/test_api.py -v --no-header -k "smoke" -x || \
          python backend/tests/smoke.py --base-url $API_BASE_URL --token $SMOKE_TEST_TOKEN --timeout 30

  rollback:
    name: Rollback on Failure
    needs:
      - smoke-test
    runs-on: ubuntu-latest
    if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64
      - name: Login to ArgoCD
        run: |
          argocd login $ARGOCD_SERVER --grpc-web --auth-token $ARGOCD_AUTH_TOKEN --insecure
      - name: Rollback all applications
        run: |
          APPS=$(argocd app list -o name | grep schoolrail-${{ github.ref_name == 'main' && 'production' || 'staging' }})
          for app in $APPS; do
            echo "Rolling back $app to previous version..."
            argocd app rollback $app --prune --grpc-web
          done
      - name: Notify rollback
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ secrets.SLACK_DEPLOY_CHANNEL }}
          payload: |
            {
              "text": ":rotating_light: Rollback triggered for SchoolRail ${{ github.ref_name == 'main' && 'production' || 'staging' }} deploy ${{ github.sha }}. Smoke tests failed.",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Rollback Triggered*\n*Environment:* ${{ github.ref_name == 'main' && 'production' || 'staging' }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      - name: Fail the workflow
        run: exit 1

  deploy-success:
    name: Notify Deploy Success
    needs:
      - smoke-test
    runs-on: ubuntu-latest
    if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - name: Tag release
        if: github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `release-${new Date().toISOString().slice(0, 10)}-${context.sha.slice(0, 7)}`;
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
      - name: Notify success
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ secrets.SLACK_DEPLOY_CHANNEL }}
          payload: |
            {
              "text": ":white_check_mark: SchoolRail ${{ github.ref_name == 'main' && 'production' || 'staging' }} deployment successful!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *Deployment Successful*\n*Environment:* ${{ github.ref_name == 'main' && 'production' || 'staging' }}\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
