{{- if .Values.networkPolicies.defaultDeny.enabled }}
{{- range .Values.networkPolicies.defaultDeny.policies }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .podSelector | nindent 6 }}
  policyTypes:
    {{- toYaml .policyTypes | nindent 4 }}
---
{{- end }}
{{- end }}
{{- range .Values.networkPolicies.allowRules }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml .podSelector | nindent 6 }}
  policyTypes:
    {{- toYaml .policyTypes | nindent 4 }}
  {{- if .ingress }}
  ingress:
    {{- toYaml .ingress | nindent 4 }}
  {{- end }}
  {{- if .egress }}
  egress:
    {{- toYaml .egress | nindent 4 }}
  {{- end }}
---
{{- end }}
