apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tenant-service.fullname" . }}-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    spec:
      restartPolicy: {{ .Values.migration.restartPolicy }}
      serviceAccountName: {{ include "tenant-service.serviceAccountName" . }}
      initContainers:
        - name: wait-for-db
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              until nc -z -w 2 $(echo $DATABASE_URL | sed 's|.*@||' | sed 's|/.*||' | cut -d: -f1) $(echo $DATABASE_URL | sed 's|.*:||' | sed 's|/.*||'); do
                echo "Waiting for database..."
                sleep 2
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.databaseUrl.name }}
                  key: {{ .Values.externalSecrets.databaseUrl.key }}
      containers:
        - name: migration
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          command:
            - alembic
            - upgrade
            - head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.databaseUrl.name }}
                  key: {{ .Values.externalSecrets.databaseUrl.key }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.secretKey.name }}
                  key: {{ .Values.externalSecrets.secretKey.key }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.redisUrl.name }}
                  key: {{ .Values.externalSecrets.redisUrl.key }}
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenant-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "tenant-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: tenant-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tenant-service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        app.kubernetes.io/name: {{ include "tenant-service.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        app.kubernetes.io/component: tenant-service
    spec:
      serviceAccountName: {{ include "tenant-service.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: pgbouncer
          image: "{{ .Values.pgbouncer.image.repository }}:{{ .Values.pgbouncer.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: pgbouncer
              containerPort: 6432
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.pgbouncerDatabaseUrl.name }}
                  key: {{ .Values.externalSecrets.pgbouncerDatabaseUrl.key }}
            - name: POOL_MODE
              value: "{{ .Values.pgbouncer.pool.mode }}"
            - name: MAX_CLIENT_CONN
              value: "{{ .Values.pgbouncer.pool.maxClientConn }}"
            - name: DEFAULT_POOL_SIZE
              value: "{{ .Values.pgbouncer.pool.defaultPoolSize }}"
            - name: MIN_POOL_SIZE
              value: "{{ .Values.pgbouncer.pool.minPoolSize }}"
            - name: RESERVE_POOL_SIZE
              value: "{{ .Values.pgbouncer.pool.reservePoolSize }}"
            - name: SERVER_IDLE_TIMEOUT
              value: "{{ .Values.pgbouncer.pool.serverIdleTimeout }}"
            - name: QUERY_TIMEOUT
              value: "{{ .Values.pgbouncer.pool.queryTimeout }}"
            - name: MAX_PREPARED_STATEMENTS
              value: "{{ .Values.pgbouncer.pool.maxPreparedStatements }}"
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.pgbouncer.resources | nindent 12 }}
        - name: tenant-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: APP_NAME
              value: "{{ .Values.config.appName }}"
            - name: DEBUG
              value: "{{ .Values.config.debug }}"
            - name: MAX_TENANTS
              value: "{{ .Values.config.maxTenants }}"
            - name: POOL_SIZE
              value: "{{ .Values.config.databasePoolSize }}"
            - name: POOL_OVERFLOW
              value: "{{ .Values.config.databasePoolOverflow }}"
            - name: POOL_TIMEOUT
              value: "{{ .Values.config.databasePoolTimeout }}"
            - name: ANALYTICS_RETENTION_DAYS
              value: "{{ .Values.config.analyticsRetentionDays }}"
            - name: ENCRYPTION_ENABLED
              value: "{{ .Values.config.encryptionEnabled }}"
            - name: DATABASE_URL
              value: "postgresql://localhost:6432/schoolrail_tenants"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.secretKey.name }}
                  key: {{ .Values.externalSecrets.secretKey.key }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.redisUrl.name }}
                  key: {{ .Values.externalSecrets.redisUrl.key }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.encryptionKey.name }}
                  key: {{ .Values.externalSecrets.encryptionKey.key }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tenant-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "tenant-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tenant-service
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: {{ .Values.service.metricsPort }}
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "tenant-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "tenant-service.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "tenant-service.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tenant-service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tenant-service.fullname" . }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tenant-service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tenant-service.fullname" . }}
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tenant-service.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: metrics
      interval: 15s
      path: /metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tenant-service.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "tenant-service.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tenant-service.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "tenant-service.name" . }}
data:
  APP_NAME: "{{ .Values.config.appName }}"
  DEBUG: "{{ .Values.config.debug }}"
  MAX_TENANTS: "{{ .Values.config.maxTenants }}"
  POOL_SIZE: "{{ .Values.config.databasePoolSize }}"
  POOL_OVERFLOW: "{{ .Values.config.databasePoolOverflow }}"
  POOL_TIMEOUT: "{{ .Values.config.databasePoolTimeout }}"
  ANALYTICS_RETENTION_DAYS: "{{ .Values.config.analyticsRetentionDays }}"
  ENCRYPTION_ENABLED: "{{ .Values.config.encryptionEnabled }}"
