replicaCount: 3

image:
  repository: schoolrail/gateway
  tag: "latest"
  pullPolicy: IfNotPresent

env:
  redisUrl: "redis://schoolrail-redis:6379"
  logLevel: "info"
  otelEndpoint: "http://schoolrail-otel-collector:4317"

service:
  type: LoadBalancer
  port: 80

jwtSecretName: schoolrail-jwt-keys

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"

serviceAccount:
  create: true
  annotations: {}
