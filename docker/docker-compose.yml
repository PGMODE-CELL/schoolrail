version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: schoolrail-backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://schoolrail:schoolrail@db:5432/schoolrail
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - DEBUG=false
    depends_on:
      - db
    volumes:
      - ../backend:/app
    restart: unless-stopped

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: schoolrail-admin
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://backend:3001
    depends_on:
      - backend
    volumes:
      - ../admin:/app
      - /app/node_modules
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: schoolrail-db
    environment:
      - POSTGRES_USER=schoolrail
      - POSTGRES_PASSWORD=schoolrail
      - POSTGRES_DB=schoolrail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: schoolrail-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: schoolrail-network